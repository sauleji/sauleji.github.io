<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пещерка для тренировок</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #d1bba7;
    }

    /* Эффект ошибки */
    body.error-shake {
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 0); }
      40% { transform: translate(8px, 0); }
      60% { transform: translate(-5px, 0); }
      80% { transform: translate(5px, 0); }
    }

    #error-overlay {
      position: fixed;
      inset: 0;
      background: rgba(220, 38, 38, 0.4);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 999;
    }

    #error-overlay.active {
      opacity: 1;
    }

    /* Успех */
    #success-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      border: 3px solid #2ecc71;
      color: #2ecc71;
      padding: 22px 42px;
      font-size: 28px;
      font-weight: bold;
      border-radius: 12px;
      z-index: 1000;
      text-align: center;
      box-shadow: 0 0 25px rgba(46, 204, 113, 0.5);
    }

    /* Верхнее меню */
    header {
      height: 28px;
      background-color: #e5cdb8;
      border-bottom: 1px solid #b39b87;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 13px;
      font-weight: bold;
      color: #000;
    }

    .nav-left {
      display: flex;
      gap: 18px;
    }

    .nav-right {
      display: flex;
      gap: 16px;
    }

    /* Основная сетка */
    .app-container {
      display: flex;
      width: 100vw;
      height: calc(100vh - 28px);
    }

    /* Левая часть - Пещера */
    .game-viewport {
      flex: 1;
      position: relative;
      background-color: #1a0b05;
      background-image: 
        radial-gradient(circle at 75% 55%, #3d1b0e 0%, #1a0b05 55%, #0a0301 100%);
      overflow: hidden;
    }

    /* Скалы и камни */
    .cave-decor-1 {
      position: absolute;
      top: 0;
      left: 0;
      width: 200px;
      height: 100%;
      background: radial-gradient(ellipse at 0% 40%, #000 0%, transparent 80%);
      pointer-events: none;
    }

    .cave-decor-2 {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 450px;
      height: 220px;
      background: radial-gradient(ellipse at 20% 100%, #120502 0%, transparent 75%);
      pointer-events: none;
    }

    .cave-decor-3 {
      position: absolute;
      bottom: 25%;
      right: 15%;
      width: 250px;
      height: 150px;
      background: radial-gradient(ellipse at 50% 50%, #301308 0%, transparent 70%);
      pointer-events: none;
    }

    /* Глаза */
    .eyes {
      position: absolute;
      left: 35px;
      top: 36%;
      display: flex;
      gap: 5px;
      z-index: 3;
    }

    .eye {
      width: 5px;
      height: 4px;
      background: #ffcc00;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffea00;
    }

    /* Сетка 10 столбцов на 6 рядов */
    .grid-container {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(6, 1fr);
      z-index: 2;
    }
